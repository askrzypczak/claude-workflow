name: ticket-labels

# Reusable workflow: on issue close, strip state labels and unblock dependents.
# Caller (in the consuming repo):
#   on: { issues: { types: [closed] } }
#   permissions: { contents: read, issues: write }
#   jobs:
#     cleanup:
#       uses: askrzypczak/claude-workflow/.github/workflows/ticket-labels.yml@main
on:
  workflow_call:
    secrets:
      workflow_token:
        description: Token able to read askrzypczak/claude-workflow (only needed if the default token cannot)
        required: false

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: askrzypczak/claude-workflow
          token: ${{ secrets.workflow_token || github.token }}
          path: claude-workflow
          sparse-checkout: plugins/ticket-workflow/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Strip state labels and unblock dependents
        run: node claude-workflow/plugins/ticket-workflow/scripts/ticket-labels.ts "$ISSUE_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
