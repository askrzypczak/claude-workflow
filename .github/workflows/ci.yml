name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm test
      - run: npm run typecheck
      - run: plugins/ticket-workflow/hooks/test-guard-git.sh
      - run: plugins/ticket-workflow/hooks/test-guard-comments.sh
