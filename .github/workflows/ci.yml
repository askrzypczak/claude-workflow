name: ci

on:
  pull_request:
  push:
    branches: [main]
  # update-prs.yml dispatches this on PR branches it pushed to; GITHUB_TOKEN pushes start no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm test
      - run: npm run typecheck
      - run: plugins/ticket-workflow/hooks/test-guard-git.sh
      - run: plugins/ticket-workflow/hooks/test-guard-comments.sh
      - run: scripts/test-check-version-bump.sh
      - run: scripts/test-update-pr-branch.sh
      - run: scripts/test-update-prs.sh
      - if: github.event_name != 'push'
        run: scripts/check-version-bump.sh origin/${{ github.base_ref || 'main' }}
